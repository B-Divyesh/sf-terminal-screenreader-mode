[package]
name = "terminal-screenreader-mode"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Turn changing terminal output into a stable screen-reader transcript"
license = "MIT"
readme = "README.md"
repository = "https://github.com/B-Divyesh/sf-terminal-screenreader-mode"
keywords = ["accessibility", "terminal", "screen-reader", "cli"]
categories = ["command-line-utilities", "accessibility"]

[[bin]]
name = "tsrm"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
clap = { version = "4.5.20", features = ["derive"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"

[profile.release]
strip = true
lto = true
codegen-units = 1

